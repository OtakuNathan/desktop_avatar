name: Pal domain contracts
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [refactor/domain-contracts]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OtakuNathan/Pal
          ref: aa815985e4f5fe60aaf3ff8d426688b2806fb693
          path: .pal-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './.pal-host[test]'
      - run: python -m pytest -q tests/test_plugin_factory.py tests/test_tool_activity.py tests/test_duplex_sidecar.py tests/test_runtime_lifecycle.py tests/test_backpressure.py tests/test_tagged_checklist.py
        env:
          PYTHONPATH: ${{ github.workspace }}/.pal-host/src
